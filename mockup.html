<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mockup — hk-bus-eta-rlcd (design.md §3)</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #fff;
  color: #000;
  font-family: 'Courier New', Courier, monospace;
  -webkit-font-smoothing: none;
  font-smooth: never;
  text-rendering: optimizeSpeed;
  image-rendering: pixelated;
  padding: 40px 32px;
}

h1 {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}
.subtitle {
  font-size: 11px;
  margin-bottom: 32px;
}
.viewer {
  display: flex;
  gap: 48px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.frame-1x {
  width: 400px;
  height: 300px;
  background: #fff;
  border: 1px solid #000;
  overflow: hidden;
  font-family: 'Courier New', Courier, monospace;
  -webkit-font-smoothing: none;
  font-smooth: never;
  text-rendering: optimizeSpeed;
  image-rendering: pixelated;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.frame-label {
  font-size: 9px;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.frame-2x {
  width: 800px;
  height: 600px;
  background: #fff;
  border: 1px solid #000;
  overflow: hidden;
  font-family: 'Courier New', Courier, monospace;
  -webkit-font-smoothing: none;
  font-smooth: never;
  text-rendering: optimizeSpeed;
  image-rendering: pixelated;
  flex-shrink: 0;
  position: relative;
}
.frame-2x .mockup-contents {
  transform: scale(2);
  transform-origin: top left;
  width: 400px;
  height: 300px;
  position: absolute;
  top: 0;
  left: 0;
}
.mockup-contents {
  display: flex;
  flex-direction: column;
  width: 400px;
  height: 300px;
  background: #fff;
}

/* ── Header band (design.md §3 rule 1) ──
   date "DD MMM (DDD)" 10px regular (single-digit day keeps a space
   in the tens slot); weather 22px bold 16px right of the date label,
   humidity 12px after temperature; time right-anchored 28px bold */
.disp-header {
  background: #000;
  color: #fff;
  height: 36px;
  min-height: 36px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.disp-header .header-left {
  display: flex;
  align-items: baseline;
  gap: 16px;  /* per design.md §3: ~16px right of the date label */
}
.disp-header .header-date {
  font-size: 10px;
  font-weight: normal;
  letter-spacing: 0.5px;
  line-height: 1;
}
.disp-header .header-weather {
  display: flex;
  align-items: baseline;
  gap: 12px;  /* per design.md §3: 12 px gap between temp and humidity */
}
.disp-header .header-temp,
.disp-header .header-hum {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 0.5px;
  line-height: 1;
}
.disp-header .header-time {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 1px;
  line-height: 1;
  margin-top: 4px;  /* push down to match firmware y=32 baseline */
}

/* ── 1px divider between rows ── */
.disp-divider {
  height: 1px;
  min-height: 1px;
  background: #000;
  width: 100%;
}

/* ── Route row (81px × 3 = 243; 300 - 36 - 3 - 18 = 243) ── */
.route-row {
  display: flex;
  width: 100%;
  height: 81px;
  min-height: 81px;
  align-items: center;
}

/* Col 1 — route number (fixed ~48px, bold, 24px, left-aligned) */
.route-col-route {
  width: 60px;
  min-width: 60px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding-left: 8px;
  align-self: stretch;
}
.route-col-route .rt-num {
  font-size: 29px;
  font-weight: bold;
  letter-spacing: -0.5px;
  line-height: 1;
}

/* Col 2 — destination + bus-stop stacked (elastic) */
.route-col-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 32px;
  align-self: stretch;
}
.route-col-info .rt-dest {
  font-size: 24px;
  font-weight: bold;
  line-height: 1.2;
  letter-spacing: -0.3px;
  white-space: nowrap;
  overflow: hidden;
}
.route-col-info .rt-stop {
  font-size: 20px;
  font-weight: normal;
  line-height: 1.2;
  letter-spacing: 0;
  white-space: nowrap;
  overflow: hidden;
  margin-top: 2px;
}

/* Col 3 — three ETA values (fixed ~120px, right-aligned, spaced) */
.route-col-eta {
  width: 120px;
  min-width: 120px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  padding-right: 10px;
  align-self: stretch;
}
.eta-row {
  display: flex;
  align-items: baseline;
  gap: 12px;  /* visible gap between each ETA value */
}
.eta-primary {
  font-size: 29px;
  font-weight: bold;
  line-height: 1;
  letter-spacing: -0.3px;
}
.eta-secondary {
  font-size: 22px;
  font-weight: normal;
  line-height: 1;
  letter-spacing: -0.3px;
  min-width: 18px;
}
.min-suffix {
  font-size: 12px;  /* per design.md §2: u8g2_font_profont12_mf */
  font-weight: normal;
  line-height: 1;
  letter-spacing: 0.5px;
  margin-top: 1px;
}

/* ── Footer band (design.md §3 rule 4) ── */
.disp-footer {
  background: #000;
  color: #fff;
  height: 18px;
  min-height: 18px;
  padding: 0 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: normal;
  line-height: 1;
  letter-spacing: 0;
}

/* ── Controls ── */
.controls {
  margin-top: 32px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.controls button {
  font-family: 'Courier New', Courier, monospace;
  font-size: 12px;
  padding: 6px 16px;
  border: 1px solid #000;
  background: #fff;
  color: #000;
  cursor: pointer;
  letter-spacing: 0.3px;
  -webkit-font-smoothing: none;
  font-smooth: never;
}
.controls button:hover {
  background: #000;
  color: #fff;
}
.controls button.active {
  background: #000;
  color: #fff;
}
.controls .set-label {
  font-size: 11px;
  margin-left: 4px;
  letter-spacing: 0.3px;
}
</style>
</head>
<body>

<h1>hk-bus-eta-rlcd &middot; design.md &sect;3 Layout</h1>
<p class="subtitle">400&thinsp;&times;&thinsp;300&thinsp;px &middot; 1-bit monochrome &middot; ST7305 &middot; 3 routes &middot; header with date + temp &amp; humidity + 28px time &middot; zh-HK CJK text</p>

<div class="viewer">
  <div>
    <div class="frame-label">1× (actual size)</div>
    <div class="frame-1x" id="mockup1x"></div>
  </div>
  <div>
    <div class="frame-label">2× zoom</div>
    <div class="frame-2x" id="mockup2x"></div>
  </div>
</div>

<div class="controls">
  <span style="font-size:11px;font-weight:bold;letter-spacing:0.3px;">Data set:</span>
  <button id="btnSet1" class="active" onclick="switchDataSet(1)">Set 1</button>
  <button id="btnSet2" onclick="switchDataSet(2)">Set 2</button>
  <button id="btnSet3" onclick="switchDataSet(3)">Set 3</button>
  <span class="set-label" id="setLabel">3 routes, 1 with "--"</span>
</div>

<script>
const dataSets = {
  1: {
    label: '3 routes, 1 with "--" (matches routes.json)',
    date: ' 9 Aug (Sun)',
    time: '14:32',
    temp: '28°C',
    hum: '70%',
    updated: '14:32:00',
    battery: 72,
    routes: [
      { num: '30X',  dest: '黃埔花園', stop: '楊屋道街市', e1: '3',  e2: '12', e3: '25' },
      { num: '238X', dest: '中港碼頭', stop: '龍德街',     e1: '8',  e2: '19', e3: '34' },
      { num: '930X', dest: '銅鑼灣',   stop: '聯仁街',     e1: '--', e2: '--', e3: '--' }
    ]
  },
  2: {
    label: 'font-shrink stress test (long zh-HK strings)',
    date: '30 Sep (Wed)',
    time: '15:07',
    temp: '31°C',
    hum: '85%',
    updated: '15:07:22',
    battery: 100,
    routes: [
      { num: '2',   dest: '中環碼頭',           stop: '中環五號碼頭',   e1: '5',  e2: '15', e3: '28' },
      { num: '5B',  dest: '堅尼地城海旁',       stop: '堅尼地城',       e1: '10', e2: '22', e3: '40' },
      { num: '23',  dest: '西營盤',             stop: '西營盤',         e1: '1',  e2: '7',  e3: '18' }
    ]
  },
  3: {
    label: 'all live ETAs, 1-digit battery (pad test)',
    date: ' 1 Oct (Thu)',
    time: '18:45',
    temp: '26°C',
    hum: '90%',
    updated: '18:45:10',
    battery: 9,
    routes: [
      { num: '1',   dest: '中環',         stop: '中環碼頭',           e1: '2',  e2: '9',  e3: '15' },
      { num: '101', dest: '堅尼地城',     stop: '堅尼地城',           e1: '7',  e2: '18', e3: '30' },
      { num: '296X',dest: '康城站',       stop: '將軍澳工業邨',       e1: '4',  e2: '11', e3: '22' }
    ]
  }
};

function buildMockup(d) {
  var html = '';
  html += '<div class="disp-header">';
  html += '<div class="header-left">';
  html += '<span class="header-date">' + d.date + '</span>';
  if (d.temp || d.hum) {
    html += '<div class="header-weather">';
    if (d.temp) html += '<span class="header-temp">' + d.temp + '</span>';
    if (d.hum) html += '<span class="header-hum">' + d.hum + '</span>';
    html += '</div>';
  }
  html += '</div>';
  html += '<span class="header-time">' + d.time + '</span>';
  html += '</div>';

  d.routes.forEach(function(r, i) {
    if (i > 0) html += '<div class="disp-divider"></div>';

    html += '<div class="route-row">';
    html += '<div class="route-col-route"><span class="rt-num">' + r.num + '</span></div>';
    html += '<div class="route-col-info">';
    html += '<div class="rt-dest"><span style="font-size:20px;">往</span> ' + r.dest + '</div>';
    html += '<div class="rt-stop">' + r.stop + '</div>';
    html += '</div>';
    html += '<div class="route-col-eta">';
    html += '<div class="eta-row">';
    html += '<span class="eta-primary">' + r.e1 + '</span>';
    html += '<span class="eta-secondary">' + r.e2 + '</span>';
    html += '<span class="eta-secondary">' + r.e3 + '</span>';
    html += '</div>';
    html += '<span class="min-suffix">min</span>';
    html += '</div>';
    html += '</div>';
  });

  html += '<div class="disp-divider"></div>';
  html += '<div class="disp-footer">';
  html += '<span>Updated ' + d.updated + '</span>';
  html += '<span>Battery: ' + String(d.battery).padStart(3, ' ') + '%</span>';
  html += '</div>';

  return html;
}

function switchDataSet(n) {
  var d = dataSets[n];
  if (!d) return;
  var html = buildMockup(d);
  document.getElementById('mockup1x').innerHTML = html;
  document.getElementById('mockup2x').innerHTML = '<div class="mockup-contents">' + html + '</div>';
  document.querySelectorAll('.controls button').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('btnSet' + n).classList.add('active');
  document.getElementById('setLabel').textContent = d.label;
}

switchDataSet(1);
</script>

</body>
</html>
